<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/liread_logo.png" />
    <link rel="apple-touch-icon" href="/liread_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liread — Mindful Reading, Soundscapes & Book Sanctuary</title>
    <meta name="description" content="Liread is a mindful reading sanctuary featuring distraction-free timers, curated ambient soundscapes, passage reflections, and social reading habits." />
    <meta name="keywords" content="reading timer, book community, ambient soundscapes, reading habit, book tracker, liread, epub reader, pdf reader" />
    <meta name="author" content="Liread" />

    <!-- Open Graph / Social Sharing (Facebook, WhatsApp, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://liread.vercel.app/" />
    <meta property="og:title" content="Liread — Mindful Reading, Soundscapes & Book Sanctuary" />
    <meta property="og:description" content="Track your reading sessions, explore curated books, and cultivate mindful reading habits." />
    <meta property="og:image" content="https://liread.vercel.app/liread_logo.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Liread — Mindful Reading & Book Sanctuary" />
    <meta name="twitter:description" content="Track your reading sessions, explore curated books, and cultivate mindful reading habits." />
    <meta name="twitter:image" content="https://liread.vercel.app/liread_logo.png" />

    <!-- Mobile Theme Colors -->
    <meta name="theme-color" content="#FAF7F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F172A" media="(prefers-color-scheme: dark)" />
    
    <!-- Google Fonts: Editorial Archivist Pairing (Newsreader, Cormorant Garamond, Syne, Inter, DM Mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500;600;700&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Immediate Theme Sync: Landing page, login page, and initial launch stay in Light Mode -->
    <script>
      (function() {
        try {
          var hash = window.location.hash;
          var isApp = hash === '#app';
          var saved = (localStorage.getItem('liread_theme') || localStorage.getItem('readers_hub_theme'));
          if (isApp && saved === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-vibe-bg text-vibe-ink antialiased selection:bg-blue-500/20 dark:selection:bg-blue-400/30 selection:text-current min-h-screen overflow-x-hidden w-full max-w-full">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
